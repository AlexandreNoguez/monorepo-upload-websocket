# API do grupo de workloads.
apiVersion: apps/v1
# StatefulSet e mais apropriado para banco por causa da persistencia e identidade estavel.
kind: StatefulSet
metadata:
  # Nome do recurso do PostgreSQL.
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: web-socket
spec:
  # Nome do Service governante usado pelo StatefulSet.
  serviceName: postgres
  # Uma replica e suficiente para o laboratorio local.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: web-socket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: web-socket
    spec:
      containers:
        - name: postgres
          # Imagem oficial simplificada para estudo.
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            # Importa as configuracoes gerais; o PostgreSQL usa apenas as variaveis que reconhece.
            - configMapRef:
                name: app-config
            # Importa as credenciais do banco a partir do Secret gerado.
            - secretRef:
                name: app-secrets
          ports:
            - name: postgres
              # Porta exposta pelo servidor PostgreSQL.
              containerPort: 5432
          volumeMounts:
            # Diretorio onde o PostgreSQL persiste os dados.
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            # Verifica se a porta do banco esta aceitando conexoes.
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Verifica se o processo principal continua respondendo.
            tcpSocket:
              port: postgres
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        # Nome do volume que sera montado no container acima.
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: web-socket
      spec:
        # Em clusters locais geralmente basta um volume exclusivo por pod.
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Tamanho inicial suficiente para o laboratorio.
            storage: 2Gi

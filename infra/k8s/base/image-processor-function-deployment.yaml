# API do grupo de workloads gerenciados.
apiVersion: apps/v1
# A Function tambem e empacotada como Deployment para o laboratorio.
kind: Deployment
metadata:
  # Nome do recurso dentro do namespace.
  name: image-processor-function
  labels:
    app.kubernetes.io/name: image-processor-function
    app.kubernetes.io/part-of: web-socket
spec:
  # Uma replica basta para estudo nesta etapa.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-processor-function
      app.kubernetes.io/part-of: web-socket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-processor-function
        app.kubernetes.io/part-of: web-socket
    spec:
      containers:
        - name: image-processor-function
          # Imagem base; o overlay local troca para a tag carregada no kind.
          image: web-socket-image-processor-function:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            # Importa configuracoes nao sensiveis do ambiente.
            - configMapRef:
                name: app-config
            # Importa segredos locais usados pela Function.
            - secretRef:
                name: app-secrets
          ports:
            # Porta nomeada para reaproveitar em probe e Service.
            - containerPort: 7071
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

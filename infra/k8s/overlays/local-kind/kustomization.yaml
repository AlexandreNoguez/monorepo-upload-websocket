apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web-socket

resources:
  - ../../base

images:
  - name: web-socket-api:latest
    newName: web-socket-api
    newTag: local
  - name: web-socket-image-processor-function:latest
    newName: web-socket-image-processor-function
    newTag: local

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: development
  - target:
      kind: Deployment
      name: image-processor-function
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: development

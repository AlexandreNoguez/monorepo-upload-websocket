services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
        "--location",
        "/data",
        "--debug",
        "/data/debug.log"
      ]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    working_dir: /workspace/apps/api
    command: ["sh", "-c", "echo 'api dev container ready'; tail -f /dev/null"]
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages:/workspace/packages
      - ./docs:/workspace/docs:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    networks:
      - backend

  image-processor-function:
    build:
      context: .
      dockerfile: infra/docker/function/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    working_dir: /workspace/apps/image-processor-function
    command:
      [
        "sh",
        "-c",
        "echo 'image processor function dev container ready'; tail -f /dev/null"
      ]
    volumes:
      - ./apps/image-processor-function:/workspace/apps/image-processor-function
      - ./packages:/workspace/packages
      - ./docs:/workspace/docs:ro
    ports:
      - "7071:7071"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  azurite-data:

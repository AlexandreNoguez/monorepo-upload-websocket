services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
        "--location",
        "/data",
        "--debug",
        "/data/debug.log"
      ]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - backend

  api:
    image: web-socket-api:local
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_RUNTIME: production
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/image_pipeline?schema=public
      AZURITE_HOST: azurite
      AZURITE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  image-processor-function:
    image: web-socket-image-processor-function:local
    build:
      context: .
      dockerfile: infra/docker/function/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_RUNTIME: production
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/image_pipeline?schema=public
      AZURITE_HOST: azurite
      AZURITE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
      FUNCTION_WEBSOCKET_URL: ws://api:3000/processing
    ports:
      - "7071:7071"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7071/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  azurite-data:
